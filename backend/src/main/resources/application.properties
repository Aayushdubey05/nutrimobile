spring.application.name=nutrivision-backend
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Database
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080
server.address=0.0.0.0

# Security
spring.security.filter.order=0
# File uploads (food photos). Spring's 1MB default is far below a phone photo.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
app.upload.dir=${APP_UPLOAD_DIR:uploads}
